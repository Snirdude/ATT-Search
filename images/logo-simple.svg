<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d77a"/>
      <stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4AA7FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4AA7FF" stop-opacity="0.12"/>
    </linearGradient>
    <clipPath id="lensClip"><circle cx="232" cy="196" r="78"/></clipPath>
  </defs>

  <!-- background tile -->
  <rect x="8" y="8" width="384" height="384" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="384" height="384" rx="56" fill="none" stroke="url(#gold)" stroke-width="10"/>

  <!-- list rows (a collection list) -->
  <g>
    <rect x="58" y="78"  width="230" height="34" rx="8" fill="#22344f"/>
    <rect x="66" y="86"  width="18" height="18" rx="4" fill="#57d36b"/>
    <rect x="94" y="91"  width="120" height="8" rx="4" fill="#9fb3cf"/>

    <rect x="58" y="128" width="230" height="34" rx="8" fill="#22344f"/>
    <rect x="66" y="136" width="18" height="18" rx="4" fill="#e0b84a"/>
    <rect x="94" y="141" width="150" height="8" rx="4" fill="#9fb3cf"/>

    <!-- highlighted row (the search hit) -->
    <rect x="58" y="178" width="284" height="40" rx="8" fill="#4AA7FF" fill-opacity="0.28" stroke="#4AA7FF" stroke-width="4"/>
    <rect x="68" y="188" width="20" height="20" rx="4" fill="#ffffff"/>
    <rect x="98" y="194" width="140" height="9" rx="4.5" fill="#ffffff"/>

    <rect x="58" y="234" width="230" height="34" rx="8" fill="#22344f"/>
    <rect x="66" y="242" width="18" height="18" rx="4" fill="#57d36b"/>
    <rect x="94" y="247" width="110" height="8" rx="4" fill="#9fb3cf"/>

    <rect x="58" y="284" width="230" height="34" rx="8" fill="#22344f"/>
    <rect x="66" y="292" width="18" height="18" rx="4" fill="#c46cf0"/>
    <rect x="94" y="297" width="135" height="8" rx="4" fill="#9fb3cf"/>
  </g>

  <!-- magnifying glass -->
  <g>
    <line x1="290" y1="254" x2="352" y2="316" stroke="#0b1220" stroke-width="36" stroke-linecap="round"/>
    <line x1="290" y1="254" x2="352" y2="316" stroke="url(#gold)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="232" cy="196" r="78" fill="url(#lens)"/>
    <!-- magnified highlight inside the lens -->
    <g clip-path="url(#lensClip)">
      <rect x="150" y="172" width="200" height="48" rx="10" fill="#4AA7FF" fill-opacity="0.35"/>
      <rect x="168" y="186" width="150" height="12" rx="6" fill="#ffffff"/>
    </g>
    <circle cx="232" cy="196" r="78" fill="none" stroke="#0b1220" stroke-width="30"/>
    <circle cx="232" cy="196" r="78" fill="none" stroke="url(#gold)" stroke-width="18"/>
    <path d="M190 150 A60 60 0 0 1 248 140" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
